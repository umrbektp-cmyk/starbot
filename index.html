<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Safiya AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0ede8; color: #1e1b4b; }
    #orb-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    #app { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; }
    .hidden { display: none !important; }

    /* Welcome */
    #welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; }
    .welcome-card { background: rgba(255,255,255,0.78); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border: 1px solid rgba(255,255,255,0.92); border-radius: 28px; padding: 36px 28px 28px; width: 100%; max-width: 390px; box-shadow: 0 12px 40px rgba(124,58,237,0.13); }
    .app-logo { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7c3aed; margin-bottom: 20px; }
    #greeting { font-size: 26px; font-weight: 700; color: #1e1b4b; line-height: 1.2; margin-bottom: 6px; }
    .welcome-sub { font-size: 14px; color: #6b7280; margin-bottom: 22px; }
    #name-input-wrap { margin-bottom: 18px; }
    #name-input { width: 100%; padding: 13px 16px; border: 2px solid #e5e7eb; border-radius: 14px; font-size: 16px; font-family: inherit; color: #1e1b4b; background: rgba(255,255,255,0.9); outline: none; transition: border-color 0.2s; }
    #name-input:focus { border-color: #7c3aed; }
    #name-input::placeholder { color: #9ca3af; }
    .level-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #9ca3af; margin-bottom: 10px; }
    .level-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; }
    .lvl-btn { padding: 11px 12px; border: 2px solid #e5e7eb; border-radius: 14px; background: rgba(255,255,255,0.7); font-size: 13px; font-weight: 500; color: #6b7280; cursor: pointer; transition: all 0.18s; text-align: left; line-height: 1.4; touch-action: manipulation; }
    .lvl-btn strong { display: block; font-size: 14px; color: #374151; }
    .lvl-btn.active { border-color: #7c3aed; background: rgba(124,58,237,0.07); color: #7c3aed; }
    .lvl-btn.active strong { color: #7c3aed; }
    #start-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%); color: white; border: none; border-radius: 18px; font-size: 16px; font-weight: 700; cursor: pointer; touch-action: manipulation; transition: opacity 0.2s, transform 0.1s; box-shadow: 0 4px 20px rgba(124,58,237,0.35); }
    #start-btn:active { opacity: 0.85; transform: scale(0.98); }
    #start-btn:disabled { opacity: 0.6; }

    /* Main — absolute, fills screen, orb behind everything */
    #main { position: absolute; inset: 0; }
    #header { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); background: rgba(255,255,255,0.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.6); }
    .header-left { display: flex; flex-direction: column; }
    .header-title { font-size: 16px; font-weight: 700; color: #1e1b4b; }
    .header-sub { font-size: 12px; color: #7c3aed; font-weight: 500; text-transform: capitalize; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1.5px solid rgba(124,58,237,0.25); border-radius: 10px; background: rgba(255,255,255,0.7); color: #7c3aed; font-size: 14px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    #lang-btn { font-size: 12px; letter-spacing: 0.04em; width: 42px; }

    /* Subtitle — captions style, fades in/out, never causes scroll */
    #subtitle { position: absolute; left: 20px; right: 20px; bottom: 130px; z-index: 2; text-align: center; font-size: 16px; line-height: 1.6; border-radius: 16px; padding: 12px 18px; opacity: 0; transition: opacity 0.6s ease; pointer-events: none; }
    #subtitle.sub-user     { color: #7c3aed; font-style: italic; font-size: 14px; }
    #subtitle.sub-interim  { color: #9ca3af; font-style: italic; font-size: 14px; }
    #subtitle.sub-assistant{ color: #1e1b4b; background: rgba(255,255,255,0.78); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    #subtitle.sub-thinking { color: #9ca3af; font-size: 22px; letter-spacing: 4px; }
    #subtitle.sub-error    { color: #dc2626; font-size: 14px; }

    /* Controls — anchored to bottom, cannot be pushed by anything */
    #controls { position: absolute; bottom: 0; left: 0; right: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; padding: 14px 20px; padding-bottom: max(22px, env(safe-area-inset-bottom, 22px)); background: rgba(255,255,255,0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.6); gap: 10px; }
    #status-text { font-size: 13px; font-weight: 500; color: #9ca3af; text-align: center; min-height: 18px; }
    #status-text.listening { color: #7c3aed; }
    #status-text.thinking  { color: #2563eb; }
    #status-text.speaking  { color: #059669; }

    /* Mic toggle */
    .mic-row { display: flex; align-items: center; gap: 14px; }
    .mic-label { font-size: 13px; font-weight: 500; color: #9ca3af; }
    .mic-switch { position: relative; width: 88px; height: 46px; cursor: pointer; display: block; }
    .mic-switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 3; }
    .mic-track { position: absolute; inset: 0; border-radius: 23px; background: #e5e7eb; transition: background 0.3s; }
    .mic-switch input:checked ~ .mic-track { background: linear-gradient(135deg, #7c3aed, #2563eb); }
    .mic-thumb { position: absolute; top: 5px; left: 5px; width: 36px; height: 36px; border-radius: 50%; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.18); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); pointer-events: none; display: flex; align-items: center; justify-content: center; color: #9ca3af; }
    .mic-switch input:checked ~ .mic-thumb { transform: translateX(42px); color: #7c3aed; }
    @keyframes mic-pulse {
      0%,100% { box-shadow: 0 2px 8px rgba(0,0,0,0.18), 0 0 0 0 rgba(124,58,237,0.4); }
      50%      { box-shadow: 0 2px 8px rgba(0,0,0,0.18), 0 0 0 10px rgba(124,58,237,0); }
    }
    .mic-switch input:checked ~ .mic-thumb { animation: mic-pulse 1.8s infinite; }

    /* Leaderboard */
    #lb-modal { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; background: rgba(30,27,75,0.4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .lb-sheet { background: rgba(255,255,255,0.96); border-radius: 28px 28px 0 0; padding-bottom: env(safe-area-inset-bottom); width: 100%; max-height: 70vh; display: flex; flex-direction: column; box-shadow: 0 -8px 32px rgba(0,0,0,0.12); }
    .lb-handle { width: 40px; height: 4px; background: #e5e7eb; border-radius: 2px; margin: 12px auto 0; }
    .lb-header { padding: 16px 20px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f3f4f6; flex-shrink: 0; }
    .lb-title { font-size: 17px; font-weight: 700; color: #1e1b4b; }
    .lb-close { width: 30px; height: 30px; border-radius: 50%; background: #f3f4f6; border: none; color: #6b7280; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .lb-list { overflow-y: auto; padding: 8px 16px 16px; }
    .lb-list::-webkit-scrollbar { display: none; }
    .lb-row { display: flex; align-items: center; padding: 12px 4px; border-bottom: 1px solid #f9fafb; gap: 12px; }
    .lb-rank { font-size: 15px; font-weight: 700; color: #9ca3af; min-width: 28px; text-align: center; }
    .lb-rank.top { color: #f59e0b; }
    .lb-info { flex: 1; }
    .lb-name { font-size: 15px; font-weight: 600; color: #1e1b4b; }
    .lb-level { font-size: 12px; color: #9ca3af; text-transform: capitalize; }
    .lb-stats { text-align: right; }
    .lb-msgs { font-size: 15px; font-weight: 700; color: #7c3aed; }
    .lb-mins { font-size: 11px; color: #9ca3af; }
    .lb-empty { text-align: center; padding: 32px; color: #9ca3af; font-size: 14px; }

  </style>
</head>

<script>
'use strict';

// ══════════════════════════════════════════════
//  ORB
// ══════════════════════════════════════════════
class Orb {
  constructor(canvas) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    this.nodes = []; this.state = 'IDLE'; this.burst = 0; this.frame = 0;
    window.addEventListener('resize', () => this._resize());
    this._resize(); this._mkNodes(); this._loop();
  }
  _resize() {
    this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight;
    this.cx = this.canvas.width/2; this.cy = this.canvas.height*0.36;
    const m = Math.min(this.canvas.width, this.canvas.height);
    this.baseR = m*0.20; this.burstR = m*0.70; this.connD = this.baseR*0.75;
  }
  _mkNodes(N=60) {
    this.nodes = [];
    for (let i=0;i<N;i++) {
      const a = Math.random()*Math.PI*2;
      const r = 4 + Math.random()*(this.baseR-4);
      this.nodes.push({
        x: Math.cos(a)*r, y: Math.sin(a)*r, vx:0, vy:0,
        angle: a, baseR: r,
        size: 1.2 + Math.random()*1.6,
        // ripple+scatter properties
        scatterAngle: Math.random()*Math.PI*2,     // direction node flies when speaking
        scatterPhase: Math.random()*Math.PI*2,     // stagger the wave timing
        baseNorm:     r / (this.baseR || 1),       // 0=center, 1=edge — drives ripple order
      });
    }
  }
  setState(s) { this.state = s; }
  _ease(t) { return t<0.5?2*t*t:-1+(4-2*t)*t; }
  _tick() {
    this.frame++;
    if (this.state==='SPEAKING') this.burst = Math.min(1, this.burst+0.022);
    else                          this.burst = Math.max(0, this.burst-0.018);

    const eased = this._ease(this.burst);

    this.nodes.forEach(n => {
      let tx, ty, spring;

      if (this.state === 'SPEAKING') {
        // Ripple wave: inner nodes (baseNorm~0) lead, outer follow.
        // scatterPhase randomises each node so no two move in lockstep.
        const wave = (Math.sin(this.frame*0.032 - n.baseNorm*Math.PI*2.2 + n.scatterPhase) + 1) / 2;
        // Mix: home position at burst=0, scatter position at burst=1
        const homeDist = n.baseR;
        const scatterDist = this.baseR*0.18 + wave * (this.burstR*0.88 - this.baseR*0.18);
        const dist = homeDist + eased*(scatterDist - homeDist);
        const angle = n.angle + eased*(n.scatterAngle - n.angle);
        tx = Math.cos(angle)*dist; ty = Math.sin(angle)*dist;
        spring = 0.045;
      } else {
        // Return home; env shrinks/stays at baseR
        const env = n.baseR * (1 - eased) + n.baseR * eased; // just home
        tx = Math.cos(n.angle)*n.baseR; ty = Math.sin(n.angle)*n.baseR;
        spring = 0.05;
      }

      const jitter = this.state==='LISTENING'?0.22 : this.state==='SPEAKING'?0.35 : 0.03;
      n.vx += (tx - n.x)*spring + (Math.random()-.5)*jitter;
      n.vy += (ty - n.y)*spring + (Math.random()-.5)*jitter;
      n.vx *= 0.84; n.vy *= 0.84;
      n.x += n.vx; n.y += n.vy;
    });
  }
  _draw() {
    const {ctx,cx,cy,burst,baseR,burstR,connD,frame} = this;
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    // Subtle center circle
    ctx.globalAlpha = 0.07 + burst*0.08;
    ctx.beginPath(); ctx.arc(cx, cy, baseR*0.55, 0, Math.PI*2);
    ctx.fillStyle = '#534AB7'; ctx.fill();
    ctx.globalAlpha = 1;

    // Node color shifts: gray → purple → deep purple
    const colIdle = '#C8C3BC', colListen = '#7F77DD', colSpeak = '#3C3489';
    const col = burst < 0.25 ? colIdle : burst < 0.6 ? colListen : colSpeak;

    // Connections — distance threshold grows as nodes spread
    const dynConn = connD*(1 + burst*1.8);
    ctx.lineWidth = 0.7 + burst*0.5;
    for(let i=0;i<this.nodes.length;i++){
      for(let j=i+1;j<this.nodes.length;j++){
        const a=this.nodes[i], b=this.nodes[j];
        const dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<dynConn){
          ctx.strokeStyle = col;
          ctx.globalAlpha = (1-d/dynConn)*(0.18+burst*0.28);
          ctx.beginPath(); ctx.moveTo(cx+a.x,cy+a.y); ctx.lineTo(cx+b.x,cy+b.y); ctx.stroke();
        }
      }
    }

    // Nodes
    this.nodes.forEach(n=>{
      const s = n.size*(1+burst*0.55);
      ctx.globalAlpha = 0.65 + burst*0.3;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(cx+n.x, cy+n.y, s, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Listening pulse ring
    if(this.state==='LISTENING'){
      const rr = baseR*0.92 + Math.sin(frame*0.05)*baseR*0.07;
      ctx.beginPath(); ctx.arc(cx,cy,rr,0,Math.PI*2);
      ctx.strokeStyle = `rgba(127,119,221,${0.22+Math.sin(frame*0.05)*0.08})`;
      ctx.lineWidth = 2; ctx.stroke();
    }

    // Center text fades out as nodes burst
    const ta = Math.max(0, 1 - burst*2.6);
    if(ta > 0){
      ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font = `600 ${Math.round(baseR*0.44)}px -apple-system,BlinkMacSystemFont,sans-serif`;
      ctx.fillStyle = `rgba(44,44,42,${ta*0.82})`; ctx.fillText('Safiya AI', cx, cy-baseR*0.09);
      ctx.font = `400 ${Math.round(baseR*0.19)}px -apple-system,BlinkMacSystemFont,sans-serif`;
      ctx.fillStyle = `rgba(95,94,90,${ta*0.65})`; ctx.fillText('by Umrbektp', cx, cy+baseR*0.26);
      ctx.restore();
    }
  }
  _loop() { this._tick(); this._draw(); requestAnimationFrame(()=>this._loop()); }
}

// ══════════════════════════════════════════════
//  APP STATE
// ══════════════════════════════════════════════
const BACKEND = 'https://safiya-ai-proxy-production.up.railway.app';
let orb, student=null, language='EN', selectedLevel='pre-intermediate';
let history=[], sessionMsgs=0, sessionStart=null;

// ── The fix: one long-lived recognition object, never manually stopped ──
// We just IGNORE results when busy (isProcessing || isSpeaking).
let recog       = null;   // the SpeechRecognition instance
let micOn       = false;  // toggle state
let isProcessing= false;  // waiting for Claude
let isSpeaking  = false;  // TTS playing
let currentAudio= null;
let ttsFetchCtrl= null;
let ttsEndTime  = 0;      // timestamp when TTS last finished — used to ignore echo

// Telegram
const tg=window.Telegram?.WebApp, tgUser=tg?.initDataUnsafe?.user;
const tgName=tgUser?.first_name?(tgUser.last_name?`${tgUser.first_name} ${tgUser.last_name}`:tgUser.first_name):null;
if(tg){try{tg.ready();tg.expand();}catch(_){}}

// ── Subtitle captions ──────────────────────────
let _subTimer = null;
function showSubtitle(text, type) {
  if (!elSubtitle) return;
  clearTimeout(_subTimer);
  elSubtitle.textContent = text;
  elSubtitle.className = 'sub-' + type;
  elSubtitle.style.opacity = '1';
}
function fadeSubtitle(delay = 0) {
  clearTimeout(_subTimer);
  _subTimer = setTimeout(() => {
    if (elSubtitle) elSubtitle.style.opacity = '0';
    _subTimer = setTimeout(() => { if (elSubtitle) elSubtitle.textContent = ''; }, 700);
  }, delay);
}




const $=id=>document.getElementById(id);
const elWelcome=$('welcome'),elMain=$('main'),elGreeting=$('greeting'),elNameWrap=$('name-input-wrap');
const elNameInput=$('name-input'),elStartBtn=$('start-btn'),elSubtitle=$('subtitle');
const elStatus=$('status-text'),elMicCheck=$('mic-check'),elHeaderName=$('header-name');
const elHeaderLvl=$('header-level'),elLangBtn=$('lang-btn'),elLbBtn=$('lb-btn');
const elLbModal=$('lb-modal'),elLbClose=$('lb-close'),elLbList=$('lb-list');

// ── Init ──────────────────────────────────────
function init() {
  orb = new Orb($('orb-canvas'));
  document.querySelectorAll('.lvl-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.lvl-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); selectedLevel=btn.dataset.level;
    });
  });
  if(tgName){elGreeting.textContent=`Hey, ${tgName}!`;}
  else{elNameWrap.classList.remove('hidden');elNameInput.addEventListener('input',()=>{elGreeting.textContent=elNameInput.value.trim()?`Hey, ${elNameInput.value.trim()}!`:'Hey there!';});}
  elStartBtn.addEventListener('click',handleStart);
  elMicCheck.addEventListener('change',()=>{ elMicCheck.checked ? micStart() : micStop(); });
  elLangBtn.addEventListener('click',()=>{ language=language==='EN'?'UZ':'EN'; elLangBtn.textContent=language; if(recog)recog.lang=language==='EN'?'en-US':'uz-UZ'; });
  elLbBtn.addEventListener('click',showLeaderboard);
  elLbClose.addEventListener('click',()=>elLbModal.classList.add('hidden'));
  elLbModal.addEventListener('click',e=>{if(e.target===elLbModal)elLbModal.classList.add('hidden');});
  window.addEventListener('beforeunload',logSession);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)logSession();});
}

// ── Welcome ───────────────────────────────────
async function handleStart() {
  const name=tgName||elNameInput.value.trim()||'Student';
  selectedLevel=document.querySelector('.lvl-btn.active')?.dataset.level||'pre-intermediate';
  elStartBtn.disabled=true; elStartBtn.textContent='Starting…';
  try{student=await apiPost('/register',{name,level:selectedLevel});}catch(_){student=null;}
  sessionStart=Date.now();
  elWelcome.classList.add('hidden'); elMain.classList.remove('hidden');
  elHeaderName.textContent=name.split(' ')[0]; elHeaderLvl.textContent=selectedLevel;
  showSubtitle(`Hey! Let's do this. What do you want to talk about today?`, 'assistant');
  fadeSubtitle(4000);
}

// ══════════════════════════════════════════════
//  MIC
// ══════════════════════════════════════════════

function micStart() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Speech recognition not supported. Use Chrome on Android or desktop.'); elMicCheck.checked=false; return; }
  micOn = true;
  setStatus('Listening…', 'listening');
  orb.setState('LISTENING');
  _launchRec();
}

function _launchRec() {
  if (!micOn || isSpeaking || isProcessing) return;
  ttsEndTime = 0; // mic is open — cooldown window has passed, clear the echo guard

  // Always create a FRESH instance — reusing after onend is unreliable on mobile
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recog = new SR();
  recog.continuous     = true;
  recog.interimResults = true;
  recog.lang = language === 'EN' ? 'en-US' : 'uz-UZ';

  recog.onresult = evt => {
    if (isProcessing || isSpeaking) return;
    let interim = '', final = '';
    for (let i = evt.resultIndex; i < evt.results.length; i++) {
      const t = evt.results[i][0].transcript;
      if (evt.results[i].isFinal) final += t; else interim += t;
    }
    if (interim) showSubtitle(interim, 'interim');
    if (final.trim()) handleSpeech(final.trim());
  };

  // Chrome stops recognition after silence — restart immediately with a new instance
  recog.onend = () => {
    if (micOn && !isSpeaking && !isProcessing) {
      setTimeout(_launchRec, 50); // near-instant restart
    }
  };

  recog.onerror = evt => {
    if (evt.error === 'aborted') return;
    if (micOn && !isSpeaking && !isProcessing) {
      setTimeout(_launchRec, 100);
    }
  };

  try { recog.start(); } catch(_) { setTimeout(_launchRec, 200); }
}

function _killRec() {
  if (recog) {
    recog.onresult = null;  // drop any queued transcription results
    recog.onend    = null;  // prevent auto-restart on stop
    recog.onerror  = null;
    try { recog.abort(); } catch(_) {}  // abort is harder than stop — kills immediately
    recog = null;
  }
}

function micStop() {
  micOn = false;
  _killRec();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  ttsFetchCtrl?.abort(); ttsFetchCtrl = null;
  isSpeaking = false; isProcessing = false;
  fadeSubtitle();
  orb.setState('IDLE');
  setStatus('Slide to start talking', '');
}

// ══════════════════════════════════════════════
//  CONVERSATION
// ══════════════════════════════════════════════

async function handleSpeech(text) {
  if (!text) return;
  isProcessing = true;

  showSubtitle(text, 'user');
  history.push({ role: 'user', content: text });
  if (history.length > 16) history = history.slice(-16);

  setStatus('Safiya is thinking…', 'thinking');
  orb.setState('IDLE');
  setTimeout(() => showSubtitle('· · ·', 'thinking'), 600);

  try {
    const data = await apiPost('/chat', {
      message: text, language,
      level: student?.level || selectedLevel,
      history: history.slice(-8),
    });
    const reply = data.reply;
    history.push({ role: 'assistant', content: reply });
    sessionMsgs++;
    isProcessing = false;
    await speak(reply);
  } catch(err) {
    isProcessing = false;
    showSubtitle('Something went wrong. Try again!', 'error');
    fadeSubtitle(3000);
    if (micOn) { setStatus('Listening…','listening'); orb.setState('LISTENING'); }
    else { setStatus('Slide to start talking',''); orb.setState('IDLE'); }
  }
}

async function speak(text) {
  if (!text) return;
  isSpeaking = true;
  _killRec();
  ttsFetchCtrl = new AbortController();
  setStatus('Safiya is speaking…', 'speaking');
  orb.setState('SPEAKING');
  showSubtitle(text, 'assistant');

  try {
    const res = await fetch(`${BACKEND}/tts`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text}), signal:ttsFetchCtrl.signal,
    });
    if (!res.ok) throw new Error(`TTS ${res.status}`);
    const blob=await res.blob(), url=URL.createObjectURL(blob);
    currentAudio = new Audio(url);
    await new Promise((resolve,reject)=>{currentAudio.onended=resolve;currentAudio.onerror=reject;currentAudio.play().catch(reject);});
    URL.revokeObjectURL(url);
  } catch(err) {
    if (err.name !== 'AbortError') console.error('TTS:', err);
  } finally {
    currentAudio=null; ttsFetchCtrl=null; isSpeaking=false;
    fadeSubtitle(500);
    if (micOn) {
      setStatus('Listening…','listening');
      orb.setState('LISTENING');
      setTimeout(_launchRec, 800);
    } else {
      setStatus('Slide to start talking','');
      orb.setState('IDLE');
    }
  }
}

// ── Leaderboard ───────────────────────────────
async function showLeaderboard() {
  elLbModal.classList.remove('hidden'); elLbList.innerHTML='<p class="lb-empty">Loading…</p>';
  try {
    const data=await apiFetch('/leaderboard');
    if(!data.length){elLbList.innerHTML='<p class="lb-empty">No students yet. Be the first!</p>';return;}
    const MEDALS=['🥇','🥈','🥉']; elLbList.innerHTML='';
    data.forEach((s,i)=>{const row=document.createElement('div');row.className='lb-row';
      row.innerHTML=`<span class="lb-rank ${i<3?'top':''}">${MEDALS[i]||i+1}</span><div class="lb-info"><p class="lb-name">${esc(s.name)}</p><p class="lb-level">${esc(s.level)}</p></div><div class="lb-stats"><p class="lb-msgs">${s.messages_sent??0} msgs</p><p class="lb-mins">${Math.round(s.minutes_spent??0)} min</p></div>`;
      elLbList.appendChild(row);});
  } catch(_){elLbList.innerHTML='<p class="lb-empty">Could not load leaderboard.</p>';}
}

// ── Helpers ───────────────────────────────────
function setStatus(t,c=''){elStatus.textContent=t;elStatus.className=c;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function apiPost(path,body){const res=await fetch(`${BACKEND}${path}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error||`HTTP ${res.status}`);}return res.json();}
async function apiFetch(path){const res=await fetch(`${BACKEND}${path}`);if(!res.ok)throw new Error(`HTTP ${res.status}`);return res.json();}
async function logSession(){if(!student?.id||!sessionStart)return;const mins=(Date.now()-sessionStart)/60000;try{await apiPost('/log',{studentId:student.id,messages:sessionMsgs,minutes:Math.round(mins*10)/10});}catch(_){}}

init();
</script>
